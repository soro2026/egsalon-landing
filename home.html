<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EG유니버스</title>
<meta name="description" content="지구 위에 세운 하루 10분 인문학 여행. 30년을 동행하는 교양우주, EG유니버스.">
<meta name="theme-color" content="#0b0907">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preload" as="image" href="media/eg_home_hero_poster.jpg?v=1017b">
<style>
/* ── EG 홈페이지 · 후킹 층 (1017) ───────────────────────────────
   결정문 〈EG홈페이지_후킹층_영상5컷_카피 v1.0 1016밤〉
   · 영상에는 글자를 굽지 않는다 — 카피 · 명패는 여기 HTML 글자로 얹는다(값 · 날짜를 고칠 수 있게)
   · 카피는 왼쪽 아래, 흰 글씨, 장식 없음(글렌스톤 명패 결)
   · 소리 없음. 레코드 소리는 나중에 손님이 누를 때만 */
:root{
  --ink:#0b0907;
  --paper:#f4efe6;
  --dim:rgba(244,239,230,.62);
  --gutter:clamp(16px,4.2vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper)}
body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}

.hero{position:fixed;inset:0;overflow:hidden;background:var(--ink) url('media/eg_home_hero_poster.jpg?v=1017b') center/cover no-repeat}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
/* 글자가 읽히도록 아래·위만 살짝 어둡게 — 영상 자체는 손대지 않는다 */
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(0deg, rgba(8,6,4,.62) 0%, rgba(8,6,4,.18) 26%, rgba(8,6,4,0) 42%),
    linear-gradient(180deg, rgba(8,6,4,.42) 0%, rgba(8,6,4,0) 18%)}

/* 고정 명패 — 맨 위 왼쪽 */
.plate{position:fixed;z-index:3;left:var(--gutter);top:calc(var(--gutter) * .8 + env(safe-area-inset-top));
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-size:13px;letter-spacing:.04em;color:var(--dim)}
.plate b{font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--paper)}
.plate .sep{opacity:.45}

/* 카피 — 왼쪽 아래, 컷마다 바뀐다 */
.copy{position:fixed;z-index:3;left:var(--gutter);right:var(--gutter);
  bottom:calc(var(--gutter) + env(safe-area-inset-bottom));
  font-size:clamp(20px,2.6vw,38px);font-weight:400;line-height:1.35;letter-spacing:-.01em;
  max-width:22em;word-break:keep-all;text-wrap:balance;text-shadow:0 1px 18px rgba(0,0,0,.45);
  opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
.copy.on{opacity:1;transform:none}

/* 빌려 쓴 땅의 이름표 — 지구 컷(①③)에서만 */
.credit{position:fixed;z-index:3;right:var(--gutter);bottom:calc(10px + env(safe-area-inset-bottom));
  font-size:10.5px;letter-spacing:.04em;color:rgba(244,239,230,.42);
  opacity:0;transition:opacity .5s}
.credit.on{opacity:1}

@media (max-width:640px){
  .plate{gap:8px;font-size:12px}
  .plate b{font-size:15px;width:100%}
  .copy{font-size:22px;max-width:15em}
}
@media (prefers-reduced-motion:reduce){
  .copy{transition:none}
}
</style>
</head>
<body>

<section class="hero" aria-label="EG유니버스 소개 영상">
  <video id="hero" muted playsinline autoplay loop preload="auto"
         poster="media/eg_home_hero_poster.jpg?v=1017b" aria-hidden="true"></video>
</section>

<div class="plate">
  <b>EG유니버스</b>
  <span>월 30,030원</span><span class="sep">·</span><span>12/25 개관</span>
</div>

<p class="copy" id="copy" aria-live="off"></p>
<div class="credit" id="credit">지도 · Google · Cesium</div>

<script>
/* ── 컷 시간표 (영상 25.8초 · 1017 소로 완성본) ──
   t = 그 컷이 시작하는 초. pos = 세로 화면(폰)에서 영상이 잘릴 때 어디를 남길지(가로 %).
   map = 구글 3D 지도가 깔린 컷인지(이름표를 단다). */
const CUTS = [
  { t: 0,     text: '지구 위에 세운 하루 10분 인문학 여행',   pos: 50, map: true  },  // ① 라탱 상공
  { t: 4.77,  text: '그림 한 점 앞에 서고',                   pos: 25, map: false },  // ② 오필리아 앞
  { t: 8.80,  text: '안데스를 넘는 복엽기에서 책을 펼치며',   pos: 46, map: true  },  // ③ 복엽기 · 손과 책
  { t: 13.03, text: '깊은 밤 별과 별을 잇는',                 pos: 92, map: false },  // ④ 별자리 그물
  { t: 19.97, text: '30년을 동행하는 교양우주',               pos: 16, map: false },  // ⑤ 음악실 안락의자
];

const v = document.getElementById('hero');
const copy = document.getElementById('copy');
const credit = document.getElementById('credit');

/* 폰은 가벼운 판, 넓은 화면은 1920 판 */
v.src = (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) > 2000 && window.innerWidth > 900)
  ? 'media/eg_home_hero_1920.mp4?v=1017b' : 'media/eg_home_hero_1280.mp4?v=1017b';

let cur = -1, swapTimer = 0;
function cutAt(time){
  let i = 0;
  for (let k = 0; k < CUTS.length; k++) if (time >= CUTS[k].t) i = k;
  return i;
}
function show(i){
  if (i === cur) return;
  cur = i;
  const c = CUTS[i];
  /* 세로 화면에서는 컷마다 남길 자리를 옮긴다 — 컷이 바뀌는 순간이라 눈에 띄지 않는다 */
  v.style.objectPosition = c.pos + '% 50%';
  credit.classList.toggle('on', c.map);
  copy.classList.remove('on');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { copy.textContent = c.text; copy.classList.add('on'); }, copy.textContent ? 380 : 0);
}
function tick(){
  show(cutAt(v.currentTime));
  requestAnimationFrame(tick);
}
show(0);
requestAnimationFrame(tick);

/* 자동재생이 막힌 브라우저(저전력 모드 등) — 첫 손길에 다시 시도한다 */
const kick = () => { v.play().catch(()=>{}); };
v.play().catch(() => {
  ['pointerdown','touchstart','keydown'].forEach(e => window.addEventListener(e, kick, { once: true, passive: true }));
});
/* 탭을 떠났다 돌아오면 이어서 */
document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
</script>
</body>
</html>
