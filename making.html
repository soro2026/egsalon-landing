<!-- 바닥 지도 — 글은 site.js 한 곳(1019) -->
<footer class="eg-map" aria-label="EG유니버스의 지도"></footer>

<script src="https://app.egsalon.com/eg_device.js?v=20260729"></script>
<script src="site.js?v=1103b"></script>
<script>
/* 타임랩스 저절로 돌기 (1105 밤 · 소로) — 화면에 반쯤 들어오면 돌고, 벗어나면 멈춘다.
   소리 없는 영상이라 muted 자동재생이 막히지 않는다. 데이터 절약을 켠 폰은 손으로 누를 때만. */
(() => {
  const v = document.getElementById('makingFilm');
  if (!v) return;
  const save = navigator.connection && navigator.connection.saveData;
  if (save || !('IntersectionObserver' in window)) return;
  let byHand = false;                       /* 손님이 직접 멈추면 다시 돌리지 않는다 */
  v.addEventListener('pause', () => { if (!v._auto) byHand = true; v._auto = false; });
  v.addEventListener('play',  () => { byHand = false; });
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { if (!byHand && v.paused) v.play().catch(() => {}); }
    else if (!v.paused) { v._auto = true; v.pause(); }
  }), { threshold: 0.5 }).observe(v);
})();
</script>
