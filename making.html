<script>
/* 타임랩스 저절로 돌기 (1105 밤 · 소로) — 화면에 반쯤 들어오면 돌고, 벗어나면 멈춘다.
   소리 없는 영상이라 muted 자동재생이 막히지 않는다. 데이터 절약을 켠 폰은 손으로 누를 때만. */
(() => {
  const v = document.getElementById('makingFilm');
  if (!v) return;
  const save = navigator.connection && navigator.connection.saveData;
  if (save || !('IntersectionObserver' in window)) return;
  let byHand = false;                       /* 손님이 직접 멈추면 다시 돌리지 않는다 */
  v.addEventListener('pause', () => { if (!v._auto) byHand = true; v._auto = false; });
  v.addEventListener('play',  () => { byHand = false; });
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { if (!byHand && v.paused) v.play().catch(() => {}); }
    else if (!v.paused) { v._auto = true; v.pause(); }
  }), { threshold: 0.5 }).observe(v);
})();
</script>
<script>

8.13,181],[238.72,182],[239.51,184],[240.22,185],[240.84,186],[241.24,187],[241.86,188],[241.9,189],[242.69,190],[243.55,191],[243.87,192],[247.4,193],[250.9,194],[255.69,195],[256.86,196],[257.57,197],[257.61,198],[257.84,199],[264.64,200],[266.05,201],[266.44,202],[266.84,203],[267.15,204],[267.43,205],[267.82,206],[268.29,207],[268.56,208],[268.64,209],[268.84,211],[269.11,214],[269.15,216],[269.19,217],[270.1,218],[271.63,219]];
  const num = box.querySelector('b'), mon = box.querySelector('i'), FADE = 3;
  const monthOf = d => new Date(2026, 3, d).getMonth() + 1;   /* Day 1 = 4월 1일 */
  let lastDay = -1, lastMon = -1, monTimer = 0, raf = 0;
  function dayAt(t){
    let lo = 0, hi = D.length - 1;
    while (lo < hi){ const m = (lo + hi + 1) >> 1; if (D[m][0] <= t) lo = m; else hi = m - 1; }
    return D[lo][1];
  }
  function draw(){
    const t = v.currentTime, dur = v.duration || 273.04;
    const d = dayAt(t);
    if (d !== lastDay){
      lastDay = d; num.textContent = 'Day ' + String(d).padStart(3, '0');
      const m = monthOf(d);
      if (m !== lastMon){
        lastMon = m; mon.textContent = m + '월'; mon.classList.add('on');
        clearTimeout(monTimer); monTimer = setTimeout(() => mon.classList.remove('on'), 2200);
      }
    }
    black.style.opacity = Math.max(0, Math.min(1, (t - (dur - FADE)) / FADE)).toFixed(3);
  }
  function loop(){ draw(); raf = v.paused ? 0 : requestAnimationFrame(loop); }
  v.addEventListener('playing', () => { box.classList.add('on'); if (!raf) raf = requestAnimationFrame(loop); });
  ['seeked', 'timeupdate'].forEach(e => v.addEventListener(e, draw));
})();
