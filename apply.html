<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은교살롱 — 첫 손님으로 오시는군요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e8dec8;
    --paper-lit: #f6efdf;
    --ink: #2a2620;
    --ink-soft: rgba(42,38,32,0.62);
    --ink-faint: rgba(42,38,32,0.42);
    --gold: #b0872f;
    --gold-deep: #8c6a22;
    --gold-accent: #c9a84c;
    --line: rgba(176,135,47,0.30);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: radial-gradient(ellipse at 50% -10%, #f3ecdb 0%, var(--paper) 58%, #ddd1b7 100%);
    color: var(--ink);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 52px 40px 44px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: linear-gradient(180deg, var(--paper-lit), #f1e9d6 100%);
    box-shadow: 0 18px 44px rgba(90,68,20,0.10), 0 2px 6px rgba(90,68,20,0.06);
  }
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1px solid var(--gold-accent);
    opacity: 0.7;
  }
  .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .kicker {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--gold-deep);
    text-align: center;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .sub {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 38px;
    font-weight: 300;
  }

  form { display: flex; flex-direction: column; gap: 20px; }
  .field label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--gold-deep);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .field label .hint {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.01em;
    color: var(--ink-faint);
    font-weight: 300;
    font-family: 'Noto Serif KR', serif;
  }
  .field input, .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(140,106,34,0.28);
    border-radius: 2px;
    padding: 13px 14px;
    color: var(--ink);
    font-family: 'Noto Serif KR', serif;
    font-size: 14.5px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .field input::placeholder, .field textarea::placeholder {
    color: var(--ink-faint);
    font-weight: 300;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.85);
  }
  .field textarea { resize: vertical; min-height: 76px; line-height: 1.6; }

  .submit-btn {
    margin-top: 6px;
    background: var(--gold-accent);
    color: #2a2620;
    border: none;
    border-radius: 2px;
    height: 50px;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(140,106,34,0.22);
    transition: filter 0.2s ease, transform 0.2s ease;
  }
  .submit-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.55; cursor: default; }

  .error-msg {
    font-size: 13px;
    color: #a63c26;
    text-align: center;
    min-height: 18px;
    font-weight: 400;
  }

  .done {
    display: none;
    text-align: center;
    padding: 24px 0 8px;
  }
  .done .mark {
    display: inline-block;
    font-size: 20px;
    color: var(--gold-deep);
    margin-bottom: 18px;
  }
  .done p {
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
    font-weight: 300;
  }

  .foot {
    margin-top: 34px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }

  @media (max-width: 480px) {
    .card { padding: 40px 26px 32px; }
    h1 { font-size: 21px; }
  }
.back-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:28px;height:44px;padding:0 28px;border:1px solid rgba(140,106,34,.45);border-radius:2px;background:transparent;color:var(--gold-deep);font-family:'Noto Serif KR',serif;font-weight:400;font-size:13.5px;letter-spacing:.05em;text-decoration:none;transition:background .25s ease,border-color .25s ease}
.back-btn:hover{background:rgba(176,135,47,.10);border-color:rgba(140,106,34,.75)}
</style>
</head>
<body>

<div class="card">

  <div id="formView">
    <div class="kicker">LES PORTES SE FERMENT</div>
    <h1>첫 손님으로 오시는군요.</h1>
    <p class="sub">초대장을 보내드릴 주소만 남겨주시면 됩니다.<br>나머지는 저희가 준비하겠습니다.</p>

    <form id="applyForm" novalidate>
      <div class="field">
        <label for="displayName">어떻게 불러드리면 좋을까요<span class="hint">닉네임, 한글 또는 영문 · 나중에 자유롭게 바꾸실 수 있어요</span></label>
        <input type="text" id="displayName" name="displayName" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">초대장을 받으실 이메일 주소<span class="hint">오타 없이 정확하게 남겨주세요</span></label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">혹시, 남기고 싶은 말이 있다면<span class="hint">선택입니다</span></label>
        <textarea id="message" name="message"></textarea>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="submit-btn" id="submitBtn">이대로 신청합니다</button>
    </form>
  </div>

  <div class="done" id="doneView">
    <div class="mark">✦</div>
    <p>잘 받았습니다.<br>순서가 오면, 조용히 문을 두드리겠습니다.</p>
    <a href="index.html" class="back-btn">← 살롱으로 돌아가기</a>
  </div>

  <div class="foot">은교(隱敎)</div>
</div>

<script>
  // Supabase 연결 정보
  var SUPABASE_URL = 'https://cyhlotwdisjvoxvfkpnd.supabase.co';
  var SUPA_KEY = 'sb_publishable_jYYfQV_wQgMRFjSUuDq7xA_gWc9vsnR';

  var form = document.getElementById('applyForm');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');
  var formView = document.getElementById('formView');
  var doneView = document.getElementById('doneView');

  function isValidEmail(v) {
    return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorMsg.textContent = '';

    var displayName = document.getElementById('displayName').value.trim();
    var email = document.getElementById('email').value.trim();
    var message = document.getElementById('message').value.trim();

    if (!displayName) {
      errorMsg.textContent = '부르실 이름을 남겨주세요.';
      return;
    }
    if (!email || !isValidEmail(email)) {
      errorMsg.textContent = '초대장을 받으실 주소를 정확히 남겨주세요.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '전하는 중…';

    fetch(SUPABASE_URL + '/rest/v1/applications', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        display_name: displayName,
        email: email,
        message: message || null
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('insert failed: ' + res.status);
        formView.style.display = 'none';
        doneView.style.display = 'block';
      })
      .catch(function (err) {
        console.error(err);
        errorMsg.textContent = '잠시 문제가 생겼어요. 다시 한번 시도해 주시겠어요?';
        submitBtn.disabled = false;
        submitBtn.textContent = '이대로 신청합니다';
      });
  });
</script>

</body>
</html>
